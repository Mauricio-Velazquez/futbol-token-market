plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.sonarqube' version '5.1.0.4882'
}

group = 'com.futbol'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

import org.gradle.testing.jacoco.tasks.JacocoReport

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.seleniumhq.selenium:selenium-java:4.20.0'
    implementation 'io.github.bonigarcia:webdrivermanager:5.9.1'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.named('test') {
    useJUnitPlatform {
        includeTags 'unit'
    }
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.register('testE2e', Test) {
    description = 'Ejecuta los tests de integración/e2e (carga contexto Spring)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
    }
    finalizedBy tasks.named('jacocoE2eReport')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            'com/futbol/tokenmarket/dto/**',
            'com/futbol/tokenmarket/exception/**',
            'com/futbol/tokenmarket/config/**',
            'com/futbol/tokenmarket/security/**'
        ])
    }))
}

tasks.register('jacocoE2eReport', JacocoReport) {
    dependsOn tasks.named('testE2e')
    executionData layout.buildDirectory.file('jacoco/testE2e.exec')
    sourceSets sourceSets.main

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            'com/futbol/tokenmarket/dto/**',
            'com/futbol/tokenmarket/exception/**',
            'com/futbol/tokenmarket/config/**',
            'com/futbol/tokenmarket/security/**'
        ])
    }))
}

tasks.register('jacocoRootReport', JacocoReport) {
    description = 'Genera un reporte de JaCoCo unificado con Unitarios y E2E'
    group = 'verification'

    dependsOn tasks.named('test'), tasks.named('testE2e'), tasks.named('compileJava'), tasks.named('processResources')

    executionData fileTree(dir: layout.buildDirectory.dir('jacoco'), include: ['*.exec'])
    
    sourceSets sourceSets.main

    reports {
        xml.required = true
        html.required = true 
    }

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            'com/futbol/tokenmarket/dto/**',
            'com/futbol/tokenmarket/exception/**',
            'com/futbol/tokenmarket/config/**',
            'com/futbol/tokenmarket/security/**'
        ])
    }))
}

tasks.register('testArch', Test) {
    description = 'Ejecuta los tests de arquitectura (ArchUnit)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'arch'
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoRootReport')
}

sonarqube {
    properties {
        property 'sonar.coverage.jacoco.xmlReportPaths', 
            layout.buildDirectory.file('reports/jacoco/jacocoRootReport/jacocoRootReport.xml').get().asFile.absolutePath
        
        property 'sonar.exclusions', 'build/**,bin/**'
        
        property 'sonar.coverage.exclusions', [
            'src/main/java/com/futbol/tokenmarket/dto/**',
            'src/main/java/com/futbol/tokenmarket/exception/**',
            'src/main/java/com/futbol/tokenmarket/config/**',     
            'src/main/java/com/futbol/tokenmarket/security/**' 
        ].join(',')
    }
}
