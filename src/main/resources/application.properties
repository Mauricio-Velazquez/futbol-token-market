spring.application.name=token-market
app.data.path=${user.home}/.futbol-token-market/tokens.json
app.users.path=bin/main/data/users.json
app.players.path=bin/main/data/players.json
app.teams.path=bin/main/data/teams.json
app.player-match-stats.path=bin/main/data/player_match_stats.json

# JWT Configuration
jwt.secret=tu-secreto-jwt-super-seguro-con-al-menos-256-bits-para-produccion-cambiar-esto
jwt.expiration-ms=86400000

# Server Configuration
server.port=8080
server.servlet.context-path=/

# CORS Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.root=INFO
logging.level.com.futbol.tokenmarket=DEBUG
