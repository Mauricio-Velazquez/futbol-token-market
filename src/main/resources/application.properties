spring.application.name=token-market

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/tokenmarket;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console (desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=tu-secreto-jwt-super-seguro-con-al-menos-256-bits-para-produccion-cambiar-esto
jwt.expiration-ms=86400000

# Server Configuration
server.port=8080
server.servlet.context-path=/

# CORS Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# SpringDoc / Swagger
springdoc.show-actuator=true
springdoc.swagger-ui.groups-order=asc
springdoc.swagger-ui.urls-primary-name=api

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics,beans,env,mappings,loggers,conditions,scheduledtasks,threaddump
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Info endpoint
info.app.name=Futbol Token Market
info.app.description=Plataforma de tokenizacion de jugadores de futbol
info.app.version=0.0.1-SNAPSHOT
info.app.java-version=21
info.app.spring-boot-version=3.4.4

# Logging
logging.level.root=INFO
logging.level.com.futbol.tokenmarket=DEBUG
